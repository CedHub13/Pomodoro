<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25:00 - Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="badge">Focus Session</div>
    <h1 class="title">Pomodoro Timer</h1>

    <!-- Countdown Display -->
    <div class="timer-display" id="timer-display">25:00</div>

    <!-- Control Buttons -->
    <div class="buttons">
      <button id="start-btn" class="btn btn-start">Start</button>
      <button id="pause-btn" class="btn btn-pause" disabled>Pause</button>
      <button id="reset-btn" class="btn btn-reset">Reset</button>
    </div>

    <!-- Current Status -->
    <p class="status-text" id="status-text">Click Start to begin focusing</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
